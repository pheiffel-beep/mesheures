<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heurêka">
<title>Heurêka · Mes heures / Mijn uren</title>
<style>
:root{
  --bg:#f6f1e9; --card:#fffdf9; --ink:#2b2230; --muted:#7a6f7f; --line:#e7dfd3;
  --accent:#6b3f7a; --accent2:#8e5aa0; --pos:#2f7d4f; --neg:#b4452f; --warn:#b7791f;
  --r:16px;
  /* couleurs des jours (d'après le tableau du service) */
  --c-dispo:#5f5f66;  --c-dispo-bg:#e2e2e6;   /* gris */
  --c-ops:#8a6d00;    --c-ops-bg:#fbf1bf;     /* jaune pâle */
  --c-conge:#ffffff;  --c-conge-bg:#2f5fb3;   /* bleu prononcé */
  --c-sam:#3f78a8;    --c-sam-bg:#dcebf8;     /* bleu pâle */
  --c-fer:#9b3f8f;    --c-fer-bg:#f3d6ee;     /* mauve (dimanche et férié) */
  --c-ex:#ffffff;     --c-ex-bg:#d0342c;      /* rouge */
  --c-z:#2c7363;      --c-z-bg:#d6efe8;       /* vert d'eau */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overflow-x:hidden;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{padding:16px 18px 6px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:14px}
main{padding:8px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.mid{font-size:20px;font-weight:600}
.small{font-size:13px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
.btn{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(107,63,122,.3)}
.btn.alt{background:#efe6f2;color:var(--accent);box-shadow:none}
.btn.ghost{background:transparent;color:var(--accent);padding:8px}
.btn.sm{padding:7px 10px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.navd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.navd button{background:#efe6f2;color:var(--accent);width:44px;padding:10px 0;font-size:18px}
.seg{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.seg:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#efe6f2;color:var(--accent);white-space:nowrap}
.tag.r{background:#e8590c;color:#fff}
.lockbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-weight:600}
.lockbar.on{background:#2b2230;color:#fff}
.lockbar.off{background:var(--card);border:1px solid var(--line)}
.lockbar button{padding:8px 12px;font-size:14px}
.locked .types,.locked #segs,.locked .grid2,.locked #halfRow,.locked .toggle,.locked #addS,.locked #addR{opacity:.45}
.lk{color:var(--muted);flex:none}
.bkwarn{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fdf0d8;border:1px solid #f0d49a;color:#7a4e0c;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.confirm{background:#f3ecf5;border:1px solid #e2d3e8;border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.confirm .row{margin-top:10px}
.bkwarn button{padding:8px 10px;font-size:13px;flex:none}
.tag.g{background:#e3efe7;color:var(--pos)}
.tag.d{background:var(--c-dispo-bg);color:var(--c-dispo)}
.tag.o{background:var(--c-ops-bg);color:var(--c-ops)}
.tag.plus{background:var(--c-fer);color:#fff}
input[type=time],input[type=date],input[type=text],input[type=number]{font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;height:46px;margin:0;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;color:var(--ink);min-width:0;width:100%;text-align:center;line-height:46px}
input::-webkit-date-and-time-value{text-align:center;margin:0}
.row input[type=number]{width:110px;flex:none}
input.left,.cr input[type=text]{text-align:left}
select{font:inherit;font-size:16px;height:46px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--ink)}
.seg .dur{min-width:58px;text-align:right;font-weight:600}
.x{background:transparent;color:var(--muted);padding:6px 8px;font-size:18px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{width:50px;height:30px;border-radius:999px;background:#ddd3e0;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)} .sw.on::after{left:23px}
.bar{height:10px;border-radius:999px;background:#ece4ee;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:999px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:transparent;color:var(--muted);padding:8px 0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:700}
textarea{width:100%;min-height:140px;font:16px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.live{font-size:13px;color:var(--pos);font-weight:600}
.warnbox{background:#fdf0d8;border:1px solid #f0d49a;color:#7a4e0c;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.info{background:var(--c-fer-bg);color:var(--c-fer);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:10px}

/* boutons de type */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ty{background:var(--card);border:2px solid var(--line);color:var(--ink);font-weight:600;font-size:14px;padding:10px 4px}
.ty.on{background:var(--kb);border-color:var(--kb);color:var(--k)}
.ty.dispo.on,.ty.ops.on,.ty.z.on{border-color:var(--k)}
.halfrow{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 12px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}

/* classes de couleur */
.k-dispo{--k:var(--c-dispo);--kb:var(--c-dispo-bg)}
.k-ops{--k:var(--c-ops);--kb:var(--c-ops-bg)}
.k-conge{--k:var(--c-conge);--kb:var(--c-conge-bg)}
.k-z{--k:var(--c-z);--kb:var(--c-z-bg)}
.k-ex{--k:var(--c-ex);--kb:var(--c-ex-bg)}
.k-fer,.k-dim{--k:var(--c-fer);--kb:var(--c-fer-bg)}
.k-sam{--k:var(--c-sam);--kb:var(--c-sam-bg)}
.daycard{border-left:6px solid var(--line)}
.daycard[class*="k-"]{border-left-color:var(--k);background:linear-gradient(90deg,var(--kb),var(--card) 75%)}
.daycard.k-conge,.daycard.k-ex{border-left-color:var(--kb)}
.k-fw,.k-wdim{--kd:var(--c-fer-bg);--kdk:var(--c-fer)}
.k-wsam{--kd:var(--c-sam-bg);--kdk:var(--c-sam)}
.daycard.diag{border-left-color:var(--kdk);background:linear-gradient(135deg,var(--kd) 0 50%,var(--kb) 50% 100%)}

.days .d{display:flex;align-items:center;gap:8px;padding:9px 8px;cursor:pointer;border-radius:8px;margin:3px 0;border-left:4px solid transparent;border-top:1px solid var(--line)}
.days .d:first-child{border-top:0}
.days .d[class*="k-"]{background:var(--kb);border-left-color:var(--k);border-top:0;color:var(--ink)}
.days .d[class*="k-"]+.d{border-top:0}
.days .d.k-conge,.days .d.k-ex{color:#fff;border-left-color:rgba(0,0,0,.25)}
.days .d.k-conge .small,.days .d.k-ex .small,.days .d.k-conge .we,.days .d.k-ex .we{color:rgba(255,255,255,.85)}
.days .d.diag{background:linear-gradient(135deg,var(--kd) 0 50%,var(--kb) 50% 100%);border-left-color:var(--kdk);color:var(--ink)}
.days .dn{width:62px;font-weight:600;flex:none}
.days .we{color:var(--muted)}
.days .dh{margin-left:auto;font-weight:600;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.legend span{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--kb);color:var(--k);font-weight:600}
.legend .diag{background:linear-gradient(135deg,var(--kd) 0 50%,var(--kb) 50% 100%);color:var(--kdk)}
.pz{font-size:11px;color:var(--muted);white-space:nowrap}

/* récap */
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv b{white-space:nowrap}
.per{border-top:1px solid var(--line);padding:10px 0}
.per:first-child{border-top:0}
.per h4{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.per .ln{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.per .ed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.per .ed label{font-size:12px;color:var(--muted)}
.per .ed input{width:100%}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#efe6f2;color:var(--accent)}
.chip.done{background:#e3efe7;color:var(--pos)}
.cr{display:grid;grid-template-columns:1fr 64px 30px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.cr:first-child{border-top:0}
.cr input[type=number]{width:100%}
.cr .u{grid-column:1 / span 2}
.fe{display:grid;grid-template-columns:1fr 30px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.fe:first-child{border-top:0}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;text-align:center}
.act{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.act th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:4px 2px}
.act th:first-child,.act td:first-child{text-align:left}
.act td{text-align:right;padding:6px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.act td.z{color:#c9c0cc}
.act tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.totals .n{font-size:24px;font-weight:700}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.langbtn{background:#efe6f2;color:var(--accent);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;margin-top:2px;box-shadow:none}
.tbtn{display:block;width:100%;height:46px;min-width:0;margin:0;padding:0 4px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:16px;text-align:center}
.tbtn:disabled{opacity:.5}
.tp{position:fixed;inset:0;background:rgba(43,34,48,.45);display:flex;align-items:center;justify-content:center;z-index:30}
.tpbox{background:var(--card);border-radius:18px;padding:18px;width:min(330px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tptitle{font-weight:700;text-align:center}
.tprow{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0}
.tprow{position:relative;margin:12px 0}
.tprow b{font-size:30px;position:relative;z-index:1}
.wband{position:absolute;left:0;right:0;top:88px;height:44px;background:#efe6f2;border-radius:12px;pointer-events:none}
.wcol{position:relative;z-index:1;height:220px;width:100px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:88px 0;box-sizing:border-box;overscroll-behavior:contain;touch-action:pan-y}
.wcol::-webkit-scrollbar{display:none}
.wcol div{height:44px;line-height:44px;text-align:center;font-size:24px;color:#a99db3;scroll-snap-align:center;cursor:pointer}
.wcol div.on{color:var(--text,#2b2230);font-size:30px;font-weight:700}
.tpbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpbtns button{padding:12px 4px}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Heurêka</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <button class="langbtn" id="langBtn" aria-label="Langue / Taal"></button>
</header>
<main>
  <!-- JOUR -->
  <div class="bkwarn hidden" id="bkWarn"><span id="bkWarnTxt"></span><button class="btn" id="bkNow" data-i18n="bk.now"></button></div>
  <section id="v-jour">
    <div class="navd">
      <button id="dPrev" data-aria="a.dprev">‹</button>
      <div style="text-align:center"><div class="mid" id="dLabel"></div><div class="small" id="dKind"></div></div>
      <button id="dNext" data-aria="a.dnext">›</button>
    </div>
    <div class="lockbar hidden" id="lockBar"><span id="lockTxt"></span><button class="btn alt" id="lockBtn"></button></div>
    <div class="types" id="types">
      <button data-type="dispo" class="ty dispo k-dispo" data-i18n="ty.dispo"></button>
      <button data-type="ops" class="ty ops k-ops" data-i18n="ty.ops"></button>
      <button data-type="conge" class="ty conge k-conge" data-i18n="ty.conge"></button>
      <button data-type="z" class="ty z k-z" data-i18n="ty.z"></button>
      <button data-type="ex" class="ty ex k-ex" data-i18n="ty.ex"></button>
    </div>
    <div class="halfrow hidden" id="halfRow"><span id="halfLab"></span><div class="sw" id="tHalf"></div></div>
    <div class="card daycard" id="dayCard">
      <div class="row between">
        <div><div class="small" data-i18n="d.counted"></div><div class="big" id="dTotal">0</div></div>
        <div style="text-align:right"><div class="small" data-i18n="d.norm"></div><div class="mid" id="dNorm"></div></div>
      </div>
      <div class="live hidden" id="dLive"></div>
      <div class="small" id="dExplain" style="margin-top:6px"></div>
      <div class="info hidden" id="dFw"></div>
    </div>
    <div class="grid2" style="margin-bottom:12px">
      <button class="btn" id="bStart" data-i18n="d.start"></button>
      <button class="btn alt" id="bEnd" data-i18n="d.end"></button>
    </div>
    <div class="card">
      <div class="row between" style="margin-bottom:4px">
        <strong data-i18n="d.prest"></strong>
        <div class="row">
          <button class="btn ghost" id="addS" data-i18n="d.addS"></button>
          <button class="btn ghost" id="addR" data-i18n="d.addR"></button>
        </div>
      </div>
      <div id="segs"></div>
      <div class="note" data-i18n="d.night"></div>
    </div>
    <div class="card">
      <div class="toggle"><span data-i18n="d.garde"></span><div class="sw" id="tGarde"></div></div>
    </div>
    <button class="btn alt hidden" id="clrDay" style="width:100%;margin-bottom:12px"></button>
  </section>

  <!-- MOIS -->
  <section id="v-mois" class="hidden">
    <div class="navd">
      <button id="mPrev" data-aria="a.mprev">‹</button>
      <div class="mid" id="mLabel"></div>
      <button id="mNext" data-aria="a.mnext">›</button>
    </div>
    <div class="card">
      <div class="small" data-i18n="m.hs"></div>
      <div class="big" id="mHS"></div>
      <div class="small" id="mHSTxt"></div>
      <div class="warnbox hidden" id="mWarn"></div>
      <div style="margin-top:14px;font-size:16px" id="mLine"></div>
      <div class="bar"><i id="mBar" style="width:0"></i></div>
      <div class="small" style="margin-top:6px" id="mNote"></div>
    </div>
    <div class="legend">
      <span class="k-dispo" data-i18n="ty.dispo"></span><span class="k-ops" data-i18n="ty.ops"></span><span class="k-conge" data-i18n="ty.conge"></span><span class="k-z" data-i18n="lg.z"></span><span class="k-ex" data-i18n="lg.ex"></span><span class="k-sam" data-i18n="lg.sam"></span><span class="k-dim" data-i18n="lg.dim"></span><span class="diag k-fw k-ops" data-i18n="lg.fw"></span><span class="diag k-wsam k-ops" data-i18n="lg.wsam"></span>
    </div>
    <div class="card days" id="mDays"></div>
    <button class="btn alt" id="mLock" style="width:100%;margin-bottom:12px" data-i18n="m.lockall"></button>
    <div class="card">
      <strong data-i18n="m.totals"></strong>
      <div class="totals" style="margin-top:10px">
        <div><div class="n" id="tOps">0</div><div class="small" data-i18n="t.ops"></div></div>
        <div><div class="n" id="tDispo">0</div><div class="small" data-i18n="t.dispo"></div></div>
        <div><div class="n" id="tRap">0</div><div class="small" data-i18n="t.rap"></div></div>
        <div><div class="n" id="tEx">0</div><div class="small" data-i18n="t.ex"></div></div>
        <div><div class="n" id="tRapp">0</div><div class="small" data-i18n="t.rapp"></div></div>
      </div>
      <div class="small" id="tOther" style="margin-top:10px;text-align:center"></div>
    </div>
  </section>

  <!-- RECAP -->
  <section id="v-recap" class="hidden">
    <div class="navd">
      <button id="yPrev" data-aria="a.yprev">‹</button>
      <div class="mid" id="yLabel"></div>
      <button id="yNext" data-aria="a.ynext">›</button>
    </div>

    <div class="card" id="cConge"></div>
    <div class="card" id="cHS"></div>
    <div class="card" id="cAct"></div>
  </section>

  <!-- REGLAGES -->
  <section id="v-reg" class="hidden">
    <div class="card">
      <strong data-i18n="r.lang"></strong>
      <div class="row between" style="margin-top:10px">
        <span data-i18n="r.langlab"></span>
        <select id="sLang"><option value="fr">Français</option><option value="nl">Nederlands</option></select>
      </div>
    </div>
    <div class="card">
      <strong data-i18n="r.regime"></strong>
      <div class="row between" style="margin-top:10px">
        <span data-i18n="r.week"></span>
        <input type="number" id="sWeek" step="0.5" min="1" max="60">
      </div>
      <div class="note" id="sDayNote"></div>
    </div>
    <div class="card">
      <strong data-i18n="r.dispo"></strong>
      <div class="grid3" style="margin-top:10px">
        <div><div class="small" data-i18n="r.from"></div><button class="tbtn" id="sDA"></button></div>
        <div><div class="small" data-i18n="r.to"></div><button class="tbtn" id="sDB"></button></div>
        <div><div class="small" data-i18n="r.pause"></div><input type="number" id="sDP" step="5" min="0" max="120" style="width:100%"></div>
      </div>
      <div class="note" id="sDNote"></div>
    </div>
    <div class="card">
      <strong data-i18n="r.rappels"></strong>
      <div class="row between" style="margin-top:10px">
        <span data-i18n="r.pad"></span>
        <select id="sPad"><option value="0" data-i18n="r.none"></option><option value="30">30 min</option><option value="60" data-i18n="r.1h"></option></select>
      </div>
      <div class="note" data-i18n="r.padnote"></div>
    </div>
    <div class="card">
      <strong data-i18n="r.start"></strong>
      <div class="grid2" style="margin-top:10px">

}

function parseHM(s){

/* ---------- jours fériés ---------- */
var ferCache={};
function easter(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
/* renvoie les clés de traduction : le nom s'affiche dans la langue choisie */
function feries(y){
  if(ferCache[y]) return ferCache[y];
  var E=easter(y), r={};
  function add(d,n){r[key(d)]=n}
  function off(n){var d=new Date(E);d.setDate(d.getDate()+n);return d}
  add(new Date(y,0,1),"fe.nouvelan");
  add(off(1),"fe.paques");
  add(new Date(y,4,1),"fe.travail");
  add(off(39),"fe.ascension");
  add(off(50),"fe.pentecote");
  add(new Date(y,6,21),"fe.nationale");
  add(new Date(y,7,15),"fe.assomption");
  add(new Date(y,10,1),"fe.toussaint");
  add(new Date(y,10,11),"fe.armistice");
  add(new Date(y,11,25),"fe.noel");
  return ferCache[y]=r;
}
function ferie(d){
  var k=key(d), f=feries(d.getFullYear())[k]; if(f) return t(f);
  var md=k.slice(5);
  for(var i=0;i<data.extraFer.length;i++){var e=data.extraFer[i]; if(e.d===k||e.d===md) return ferName(e);}
  return null;
}
function isWeekday(d){var w=d.getDay();return w>=1&&w<=5}

/* ---------- jour ---------- */
function day(k,create){
  var x=data.days[k];

  return x||{segs:[],garde:false,type:null};
}
/* pause du Dispo gradé : seulement sur une journée complète (durée au moins égale à l'horaire standard) */
function pauseOn(s){
  if(!s.p) return false;
  var S=data.settings, std=toMin(S.dispoB)-toMin(S.dispoA); if(std<=0) std+=1440;
  var a=toMin(s.a), b=toMin(s.b); if(a==null||b==null) return true;
  var d=b-a; if(d<0) d+=1440;
  return d>=std;
}
function segMin(s,live){
  var a=toMin(s.a); if(a==null) return 0;
  var b=toMin(s.b);
  if(b==null){ if(!live) return 0; b=toMin(nowHM()); }
  var d=b-a; if(d<0) d+=1440;
  if(s.b && pauseOn(s)) d-= s.p;
  if(s.t==="r" && s.b) d+=2*(data.settings.rappelPad||0);
  return Math.max(0,d);
}
function worked(k,live){var x=day(k),t=0; x.segs.forEach(function(s){t+=segMin(s,live&&k===key(today()))}); return t;}
function hasContent(x){return !!(x.type||x.segs.some(function(s){return s.a}))}
function isHalf(x){return !!x.half&&x.type==="conge"}
/* jour presté (Dispo/Opération) complété par du congé : le reste de la norme est pris en congé */
function isRest(d,x){return !!x.rest&&(x.type==="dispo"||x.type==="ops")&&isWeekday(d)&&!ferie(d)}
/* férié (lun.–ven.) où il a presté : +1 jour de congé, heures en heures sup */
function workedFerie(d,x){
  if(!isWeekday(d)||!ferie(d)) return false;
  return x.type==="dispo"||x.type==="ops"||x.segs.some(function(s){return s.a&&s.b});
}
function credit(k,live){
  var d=parseKey(k), x=day(k), w=worked(k,live);
  if(!isWeekday(d)) return w;
  if(ferie(d)) return w+NORM();
  if(x.type==="conge") return w+(isHalf(x)?NORM()/2:NORM());
  if(x.type==="ex") return w+NORM();
  if(isRest(d,x)) return Math.max(w,NORM());
  return w; /* Z : rien n'est crédité, les 7 h 36 sortent des heures sup */
}
function congeUsed(d,x){
  if(isRest(d,x)&&tracked(key(d))) return Math.max(0,NORM()-worked(key(d)))/NORM();
  if(x.type!=="conge"||!isWeekday(d)||ferie(d)) return 0;
  return isHalf(x)?0.5:1;
}
/* un jour compte dans le solde s'il est passé, ou aujourd'hui s'il est encodé */
function counted(k){var tk=key(today()); return k<tk||(k===tk&&hasContent(day(k)))}
function tracked(k){return k>=data.track.start}

function kcls(d,x){
  var t=x.type;

  if(!isWeekday(d)&&(!t||t==="dispo"||t==="ops")&&(t||x.segs.some(function(s){return s.a&&s.b})))
    return "diag "+(d.getDay()===6&&!ferie(d)?"k-wsam":"k-wdim")+" "+tc;
  if(t) return "k-"+t;
  if(ferie(d)) return "k-fer";

}

/* ---------- mois ---------- */
function monthStats(y,m){
  var n=new Date(y,m+1,0).getDate(), obj=0, done=0, objToDate=0, doneToDate=0, fullDone=0, fullObj=0;
  var c={ops:0,dispo:0,rap:0,conge:0,z:0,ex:0,fw:0,garde:0};
  for(var i=1;i<=n;i++){
    var d=new Date(y,m,i), k=key(d), x=day(k);
    if(x.type==="ops") c.ops++;
    if(x.type==="dispo") c.dispo++;
    c.rap+=x.segs.filter(function(s){return s.t==="r"&&s.a}).length;
    c.conge+=congeUsed(d,x);
    if(x.type==="z"&&isWeekday(d)) c.z+=isHalf(x)?0.5:1;
    if(x.type==="ex") c.ex++;
    if(x.garde) c.garde++;
    if(workedFerie(d,x)) c.fw++;
    var cr=credit(k,true);
    fullDone+=cr; if(isWeekday(d)) fullObj+=NORM();
    if(!tracked(k)) continue;
    if(isWeekday(d)) obj+=NORM();
    done+=cr;
    if(counted(k)){ doneToDate+=cr; if(isWeekday(d)) objToDate+=NORM(); }
  }
  return {obj:obj,done:done,objToDate:objToDate,doneToDate:doneToDate,fullDone:fullDone,fullObj:fullObj,n:n,c:c};

var psMemo={};
function pState(y,p){
  var id=y+"-"+p; if(psMemo[id]) return psMemo[id];
  var start=new Date(y,2*p,1), end=new Date(y,2*p+2,0), ts=parseKey(data.track.start), t=today();
  var r={y:y,p:p,id:id,start:start,end:end,cur:(t>=start&&t<=end),fut:start>t,closed:end<t};
  if(end<ts){r.tracked=false; return psMemo[id]=r}
  r.tracked=true;
  if(ts>=start) r.inBal=data.track.hs;
  else { var pp=p?pState(y,p-1):pState(y-1,5); r.inBal=pp.out; }
  var delta=0, d=new Date(Math.max(start.getTime(),ts.getTime())), lim=end<t?end:t;
  while(d<=lim){var k=key(d); if(counted(k)) delta+=credit(k,true)-(isWeekday(d)?NORM():0); d.setDate(d.getDate()+1);}
  var pe=data.periods[id]||{};
  r.delta=delta; r.paid=pe.paid||0; r.conv=pe.conv||0;
  r.out=r.inBal+delta-r.paid-r.conv*NORM();
  return psMemo[id]=r;
}

/* ---------- congés par année ---------- */
function congeStats(Y){

  var base=0; yd.credits.forEach(function(c){base+=(+c.j||0)});
  var used=+yd.before||0, list=[], fer=[];

    var d=parseKey(k), x=data.days[k], u=congeUsed(d,x);

  return {base:base,fer:fer,conv:conv,total:total,used:used,rest:total-used,list:list,before:+yd.before||0};

function renderJour(keepSegs){

/* sauvegarde en fichier : feuille de partage (Fichiers, Drive, Mail…) ou téléchargement */
function backupFile(){
  var d=today(), name="heureka-"+key(d)+".json";
  var snap=JSON.parse(JSON.stringify(data)); snap.lastBackup=Date.now();
  var json=JSON.stringify(snap,null,1), file=null;
  try{ file=new File([json],name,{type:"application/json"}) }catch(e){}
  function download(){
    try{
      var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
      a.download=name; document.body.appendChild(a); a.click(); a.remove();
      markBackup(t("b.saved",name));
    }catch(e){ toast(t("b.fail")); }
  }
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:t("b.title")}).then(function(){ markBackup(t("b.saved2")); },
      function(e){ if(e&&e.name==="AbortError") toast(t("b.cancel")); else download(); });
  } else download();
}

    '<div class="row"><button class="btn" id="bkYes">'+esc(t("b.yes"))+'</button><button class="btn alt" id="bkNo">'+esc(t("b.no"))+'</button></div>';

var tpCb=null;
function wMark(c){ var i=Math.round(c.scrollTop/44), k=c.children; for(var j=0;j<k.length;j++) k[j].classList.toggle("on",j===i); }
function wGet(c){ var i=Math.max(0,Math.min(c.children.length-1,Math.round(c.scrollTop/44))); return pad(i); }
function wInit(c,n){
  if(c.children.length) return;
  for(var i=0;i<n;i++){ var d=document.createElement("div"); d.textContent=pad(i); d.dataset.i=i; c.appendChild(d); }
  var tk=0; c.addEventListener("scroll",function(){ if(tk) return; tk=requestAnimationFrame(function(){ tk=0; wMark(c) }) });
  c.addEventListener("click",function(e){ var d=e.target.closest("[data-i]"); if(d) c.scrollTo({top:d.dataset.i*44,behavior:"smooth"}) });
}
function openTP(title,val,canClear,cb){
  var hs=$("tpH"), ms=$("tpM"); wInit(hs,24); wInit(ms,60);
  var v=(val||nowHM()).split(":");
  $("tpTitle").textContent=title; $("tpClr").classList.toggle("hidden",!canClear);
  tpCb=cb; $("tp").classList.remove("hidden");
  hs.style.scrollSnapType=ms.style.scrollSnapType="none";
  hs.scrollTop=(+v[0])*44; ms.scrollTop=(+v[1])*44; wMark(hs); wMark(ms);
  setTimeout(function(){ hs.style.scrollSnapType=ms.style.scrollSnapType=""; },50);
}
function closeTP(v){ var cb=tpCb; tpCb=null; $("tp").classList.add("hidden"); if(cb) cb(v); }
$("tpOk").onclick=function(){ closeTP(wGet($("tpH"))+":"+wGet($("tpM"))); };
$("tpClr").onclick=function(){ closeTP(null); };
$("tpNo").onclick=function(){ tpCb=null; $("tp").classList.add("hidden"); };
$("segs").addEventListener("click",function(e){
  var tb=e.target.closest(".tbtn");
  if(tb){
    if(blocked(key(cur))) return;
    var s0=day(key(cur)).segs[+tb.dataset.i]; if(!s0) return;
    var f=tb.dataset.f, i0=+tb.dataset.i, kk=key(cur);
    openTP(t(f==="a"?"tp.begin":"tp.end"), s0[f]||(f==="b"&&s0.a)||"", true, function(v){
      var s2=day(kk,true).segs[i0]; if(!s2) return;
      s2[f]=v; save(); render();
    });
    return;
  }
  var t_=e.target.closest("[data-del]"); if(!t_)return; if(blocked(key(cur)))return;
  var i=+t_.dataset.del, b=t_;
  if(b.dataset.armed){day(key(cur),true).segs.splice(i,1);save();render();toast(t("t.deleted"));return}
  b.dataset.armed="1"; b.textContent=t("t.delask"); b.style.color="var(--neg)";
  setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent="×";b.style.color=""}},2500);
});
$("tGarde").onclick=function(){if(blocked(key(cur)))return;var x=day(key(cur),true);x.garde=!x.garde;save();render()};
$("tHalf").onclick=function(){if(blocked(key(cur)))return;var x=day(key(cur),true);if(x.type!=="dispo"&&x.type!=="ops")return;x.rest=!x.rest;save();render()};
$("types").addEventListener("click",function(e){
  var b=e.target.closest(".ty"); if(!b) return; if(blocked(key(cur))) return;
  var x=day(key(cur),true), ty=b.dataset.type, S=data.settings;
  if(x.type===ty){ x.type=null; x.half=false; x.rest=false; if(ty==="dispo") x.segs=x.segs.filter(function(s){return s.t!=="d"}); save(); render(); return; }
  if(x.type==="dispo") x.segs=x.segs.filter(function(s){return s.t!=="d"});
  x.type=ty; x.half=false; if(ty!=="dispo"&&ty!=="ops") x.rest=false;
  if(ty==="dispo"){ x.segs=x.segs.filter(function(s){return s.a}); x.segs.unshift({t:"d",a:S.dispoA,b:S.dispoB,p:S.dispoP}); toast(t("tt.dispo",fmt(segMin(x.segs[0])))); }
  if(ty==="ops" && !x.segs.some(function(s){return s.t==="s"})){ x.segs.push({t:"s",a:"",b:""}); toast(t("t.enc")); }
  save(); render();
  if(ty==="z"){ var k=key(cur); if(counted(k)) warnHS(); else { var h=hsNow()-NORM(); if(h< -600) toast(t("t.afterz",fmt(h,true)),3500); } }
});
$("mLock").onclick=function(){
  var y=mCur.getFullYear(), m=mCur.getMonth(), n=new Date(y,m+1,0).getDate(), tk=key(today()), c=0;
  for(var i=1;i<=n;i++){ var k=key(new Date(y,m,i)), x=data.days[k]; if(x&&k<tk&&hasContent(x)&&!x.lock){x.lock=true;c++} }
  save(); render(); toast(c?t("n.figes",c):t("n.nofig"));
};
$("mDays").addEventListener("click",function(e){var r=e.target.closest(".d");if(!r)return;cur=parseKey(r.dataset.k);view="jour";render();window.scrollTo(0,0)});

/* récap : congés */
$("cConge").addEventListener("click",function(e){
  var t_=e.target;
  if(t_.id==="yCreate"){
    var Y=rYear, prev=data.years[Y-1]?congeStats(Y-1).rest:0;
    data.years[Y]={before:0,credits:[
      {k:"cl.report",j:Math.max(0,Math.round(prev*2)/2),u:Y+"-05-31"},
      {k:"cl.vacances",j:36,u:Y+"-12-31"}
    ]};
    editCredits=true; save(); render(); toast(t("c.created",Y));
    return;
  }
  if(t_.id==="crEdit"){editCredits=!editCredits;render();return}
  if(t_.id==="crAdd"){data.years[rYear].credits.push({l:t("cl.new"),j:1,u:rYear+"-12-31"});save();render();return}
  var del=t_.closest("[data-cdel]");
  if(del){
    if(del.dataset.armed){data.years[rYear].credits.splice(+del.dataset.cdel,1);save();render();return}
    del.dataset.armed="1";del.textContent="?";del.style.color="var(--neg)";
    setTimeout(function(){if(del.isConnected){delete del.dataset.armed;del.textContent="×";del.style.color=""}},2500);
  }
});
$("cConge").addEventListener("change",function(e){
  var t_=e.target, yd=data.years[rYear]; if(!yd) return;
  if(t_.id==="crBefore"){var v=parseFloat(String(t_.value).replace(",","."));yd.before=isNaN(v)?0:v;save();render();return}
  if(t_.dataset.ci!=null){
    var c=yd.credits[+t_.dataset.ci]; if(!c) return;
    if(t_.dataset.cf==="j"){var j=parseFloat(String(t_.value).replace(",","."));c.j=isNaN(j)?0:j}
    else if(t_.dataset.cf==="l"){ if(t_.value!==crLabel(c)){c.l=t_.value; delete c.k;} }
    else c[t_.dataset.cf]=t_.value;
    save(); render();
  }
});
/* récap : heures sup */
$("cHS").addEventListener("change",function(e){
  var t_=e.target, id=t_.dataset.pid; if(!id) return;
  var pe=data.periods[id]||(data.periods[id]={});
  if(t_.dataset.pf==="paid"){var v=parseHM(t_.value); if(v==null||v<0){toast(t("h.fmt"));return} pe.paid=v}
  if(t_.dataset.pf==="conv"){var n=parseInt(t_.value,10); pe.conv=isNaN(n)||n<0?0:n}
  save(); render();
  if(t_.dataset.pf==="conv"&&pe.conv) toast(t("h.convt",pe.conv));
  warnHS();
});
$("cHS").addEventListener("click",function(e){
  var a=e.target.closest("[data-pall]"), r=e.target.closest("[data-prep]");
  if(a){var pe=data.periods[a.dataset.pall]||(data.periods[a.dataset.pall]={}); pe.paid=Math.round(+a.dataset.v); save(); render(); toast(t("h.paidt",fmt(pe.paid)))}
  if(r){var pr=data.periods[r.dataset.prep]||(data.periods[r.dataset.prep]={}); pr.paid=0; pr.conv=0; save(); render(); toast(t("h.reportt"))}
});

function copy(text,msg){
  function fallback(){var ta=document.createElement("textarea");ta.value=text;ta.readOnly=true;ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg)}catch(e){toast(t("b.select"))}ta.remove()}
  try{navigator.clipboard.writeText(text).then(function(){toast(msg)},fallback)}catch(e){fallback()}
}
